name: Concursos Watch — Search Probe

on:
  workflow_dispatch:
  schedule:
    # Sensor auxiliar, intercalado com o monitor principal.
    - cron: "11,41 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: concursos-watch-search-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar sensor
        run: python -m py_compile monitor.py monitor_runner.py smtp_alert.py search_probe.py

      - name: Consultar índice web auxiliar
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          WATCH_PRIORITY_TERMS: ${{ secrets.WATCH_PRIORITY_TERMS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_ALERT_TO: ${{ secrets.GMAIL_ALERT_TO }}
          GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}
          ALERT_GITHUB_ASSIGNEE: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python search_probe.py

      - name: Persistir estado do sensor
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f state/search.json ]]; then
            echo "Sensor desativado/sem estado (por exemplo, JINA_API_KEY ausente)."
            exit 0
          fi
          if [[ -z "$(git status --porcelain -- state/search.json)" ]]; then
            echo "Sem novo estado para persistir."
            exit 0
          fi
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          git add state/search.json
          git commit -m "chore(watch): update auxiliary search probe state"
          git pull --rebase origin main
          git push origin HEAD:main
