name: Concursos Watch — CI

on:
  pull_request:
  push:
    branches: [main, feat/concursos-watch-v3-hardening]
    paths:
      - "monitor.py"
      - "monitor_runner.py"
      - "smtp_alert.py"
      - "deep_audit.py"
      - "search_probe.py"
      - "new_contests.py"
      - "relevance_filter.py"
      - "canonicalize_contests.py"
      - "generic_health.py"
      - "priority_scanner.py"
      - "build_d1_snapshot.py"
      - "ensure_d1_v4.py"
      - "validate_dashboard_config.py"
      - "validate_dashboard_bundle.py"
      - "build_dashboard_sql.py"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - "cloudflare/schema.sql"
      - "cloudflare/migrations/**"
      - "edge/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Python syntax and v4 regression suite
        run: |
          python -m py_compile \
            monitor.py monitor_runner.py smtp_alert.py deep_audit.py search_probe.py \
            new_contests.py relevance_filter.py canonicalize_contests.py generic_health.py \
            priority_scanner.py build_d1_snapshot.py ensure_d1_v4.py \
            validate_dashboard_config.py validate_dashboard_bundle.py build_dashboard_sql.py
          python monitor.py --self-test
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Relevance anti-noise gate
        run: |
          python -m unittest tests.test_relevance_filter tests.test_new_contests -v
          python - <<'PY'
          import json
          with open('config/new_contests_sources.json', encoding='utf-8') as f:
              cfg = json.load(f)
          terms = [x.casefold().strip() for x in cfg.get('include_terms', [])]
          assert 'edital' not in terms, 'bare edital must never be a broad positive signal'
          PY

      - name: Dashboard declarative and static security gates
        run: |
          python validate_dashboard_config.py config/dashboard.json
          cargo run --quiet --manifest-path edge/Cargo.toml --bin render-dashboard-preview
          python validate_dashboard_bundle.py edge/test-output/dashboard.html edge/test-output/dashboard.css

      - name: D1 v4 schema contract
        run: |
          python - <<'PY'
          from pathlib import Path
          schema=Path('cloudflare/schema.sql').read_text(encoding='utf-8').lower()
          migration=Path('cloudflare/migrations/0002_v4.sql').read_text(encoding='utf-8').lower()
          for token in ('relevance_status', 'relevance_confidence', 'dashboard_configs'):
              assert token in schema, token
              assert token in migration, token
          assert "status in ('draft', 'published', 'superseded')" in schema
          print('D1 v4 schema contract OK')
          PY

      - name: Legacy public ingest must not be reachable from Rust
        run: |
          cargo test --manifest-path edge/Cargo.toml public_ingest_does_not_exist -- --exact

      - name: Validar bootstrap PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/bootstrap-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
