name: Concursos Watch — CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "monitor_runner.py"
      - "smtp_alert.py"
      - "deep_audit.py"
      - "search_probe.py"
      - "config/**"
      - "requirements.txt"
      - "cloudflare/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Validar Python e JSON
        run: |
          python -m py_compile monitor.py monitor_runner.py smtp_alert.py deep_audit.py search_probe.py
          python monitor.py --self-test
          python - <<'PY'
          import json
          import deep_audit
          import monitor_runner as tr
          import smtp_alert
          import search_probe

          assert tr._allowed("https://www.ibamsp-concursos.org.br/informacoes/134/")
          assert not tr._allowed("https://example.com/")
          rendered = tr._markdown_as_html("[Edital](https://example.org/a.pdf)")
          assert 'href="https://example.org/a.pdf"' in rendered
          assert smtp_alert.send_gmail("teste", "teste") is False

          fake_search = '''Title: IBAM São Vicente\nURL Source: https://www.ibamsp-concursos.org.br/informacoes/134/\nSÃO VICENTE - CONCURSO PÚBLICO - 02/2026\n24- Despacho de Homologação Parcial'''
          sections = search_probe.official_sections(fake_search, "ibamsp-concursos.org.br/informacoes/134")
          assert len(sections) == 1
          probe = search_probe.PROBES[0]
          assert search_probe.relevant_contexts(sections[0], probe)
          assert not search_probe.official_sections("Title: blog aleatório", probe["official_marker"])

          with open("config/deep_seeds.json", encoding="utf-8") as f:
              deep_seeds = json.load(f)
          seed_docs = deep_seeds["sources"]["sv_ibam_02_2026"]
          assert len(seed_docs) >= 2
          assert all(d["url"].startswith("https://anexos-r2.selecao.net.br/") for d in seed_docs)
          selected = deep_audit.selected_documents(
              {"id": "sv_ibam_02_2026", "deep_audit_count": 2},
              {"sv_ibam_02_2026": {"document_urls": ["https://x/old.pdf", seed_docs[0]["url"]]}},
              deep_seeds,
          )
          selected_urls = [d["url"] for d in selected]
          assert seed_docs[0]["url"] in selected_urls
          assert seed_docs[1]["url"] in selected_urls
          assert selected_urls.count(seed_docs[0]["url"]) == 1

          for path in ("config/sources.json", "config/deep_seeds.json"):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK:", path)
          print("transport + smtp + search probe + deep seeds OK")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar Worker e Wrangler
        working-directory: cloudflare
        env:
          WATCHDOG_TOKEN: ci-placeholder-not-a-real-secret
        run: |
          npm install --no-audit --no-fund
          node --check src/index.js
          node scripts/bootstrap.mjs --offline
          node scripts/secrets.mjs
          npx wrangler deploy --dry-run --config wrangler.generated.jsonc --secrets-file .secrets.generated.json
          rm -f wrangler.generated.jsonc .secrets.generated.json
