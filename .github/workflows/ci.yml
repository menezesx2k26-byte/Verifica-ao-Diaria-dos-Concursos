name: Concursos Watch — CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "monitor_runner.py"
      - "smtp_alert.py"
      - "deep_audit.py"
      - "config/**"
      - "requirements.txt"
      - "cloudflare/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Validar Python e JSON
        run: |
          python -m py_compile monitor.py monitor_runner.py smtp_alert.py deep_audit.py
          python monitor.py --self-test
          python - <<'PY'
          import json
          import monitor_runner as tr
          import smtp_alert
          assert tr._allowed("https://www.ibamsp-concursos.org.br/informacoes/134/")
          assert not tr._allowed("https://example.com/")
          rendered = tr._markdown_as_html("[Edital](https://example.org/a.pdf)")
          assert 'href="https://example.org/a.pdf"' in rendered
          # With no SMTP secrets CI must skip the channel without network access.
          assert smtp_alert.send_gmail("teste", "teste") is False
          for path in ("config/sources.json",):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK:", path)
          print("transport wrapper + smtp optional channel OK")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar Worker e Wrangler
        working-directory: cloudflare
        env:
          WATCHDOG_TOKEN: ci-placeholder-not-a-real-secret
        run: |
          npm install --no-audit --no-fund
          node --check src/index.js
          node scripts/bootstrap.mjs --offline
          node scripts/secrets.mjs
          npx wrangler deploy --dry-run --config wrangler.generated.jsonc --secrets-file .secrets.generated.json
          rm -f wrangler.generated.jsonc .secrets.generated.json
