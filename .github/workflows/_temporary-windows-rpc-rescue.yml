name: Temporary Windows identity discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temporary-windows-rpc-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null
          sudo systemctl enable --now tailscaled >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq samba-common-bin smbclient python3-impacket jq curl >/dev/null

      - name: Start private tailnet login
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/ts-login.txt /tmp/auth-url.txt
          (sudo tailscale up --hostname="gh-id-discovery-${GITHUB_RUN_ID}" --accept-dns=true > /tmp/ts-login.txt 2>&1) &
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://login\.tailscale\.com/a/[A-Za-z0-9_-]+' /tmp/ts-login.txt | head -1 || true)
            if [ -n "$URL" ]; then
              echo "::add-mask::$URL"
              printf '%s\n' "$URL" > /tmp/auth-url.txt
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Store login handoff
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-id-discovery-auth-${{ github.run_id }}
          path: /tmp/auth-url.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for tailnet authorization
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            STATE=$(sudo tailscale status --json 2>/dev/null | jq -r '.BackendState // empty' || true)
            if [ "$STATE" = 'Running' ]; then
              echo 'TAILSCALE_AUTHORIZED=true'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Discover Windows identity and supported management metadata
        shell: bash
        run: |
          set +e
          TARGET='100.98.47.109'
          FQDN='desktop-l6citui.tailacdd21.ts.net'

          echo '=== RPC NULL SESSION ==='
          rpcclient -N -U '' "$TARGET" -c 'lsaquery;querydominfo;enumdomusers' 2>&1 | head -n 240

          echo '=== IMPACKET SID LOOKUP ==='
          if [ -f /usr/share/doc/python3-impacket/examples/lookupsid.py ]; then
            python3 /usr/share/doc/python3-impacket/examples/lookupsid.py -no-pass "@$TARGET" 2>&1 | head -n 240
          fi

          echo '=== SMB SERVER INFO ==='
          smbclient -L "//$TARGET" -N -m SMB3 2>&1 | head -n 120

          echo '=== OMNIROUTE DOCUMENTED/READ-ONLY ENDPOINTS ==='
          for path in /api/monitoring/health /dashboard /api/status /api/health; do
            echo "--- $path ---"
            curl -sS -i --connect-timeout 4 --max-time 8 "http://$TARGET:20128$path" 2>&1 | head -n 100
          done

          echo '=== TAILSCALE HTTPS METADATA ==='
          for path in / /status /api; do
            echo "--- $path ---"
            curl -k -sS -i --resolve "$FQDN:443:$TARGET" --connect-timeout 4 --max-time 8 "https://$FQDN$path" 2>&1 | head -n 80
          done

          echo '=== DONE ==='
