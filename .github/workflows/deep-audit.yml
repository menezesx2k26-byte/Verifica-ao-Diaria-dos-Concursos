name: Concursos Watch — Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deep_audit.py"
      - "monitor.py"
      - "monitor_runner.py"
      - "smtp_alert.py"
      - "config/sources.json"
      - ".github/workflows/deep-audit.yml"
  schedule:
    # 09:13 em America/Sao_Paulo (UTC-3 em 2026).
    - cron: "13 12 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: concursos-watch-deep-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar scripts
        run: |
          python -m py_compile monitor.py monitor_runner.py smtp_alert.py deep_audit.py
          python monitor.py --self-test

      - name: Auditar documentos conhecidos por conteúdo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_ALERT_TO: ${{ secrets.GMAIL_ALERT_TO }}
          GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}
          WATCH_PRIORITY_TERMS: ${{ secrets.WATCH_PRIORITY_TERMS }}
          ALERT_GITHUB_ASSIGNEE: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python deep_audit.py

      - name: Persistir fingerprints
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- state/deep.json; then
            echo "Sem mudança no estado profundo."
            exit 0
          fi
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          git add state/deep.json
          git commit -m "chore(watch): update deep document fingerprints"
          git pull --rebase origin main
          git push origin HEAD:main
