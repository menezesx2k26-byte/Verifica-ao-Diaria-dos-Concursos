name: Concursos Watch — Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deep_audit.py"
      - "monitor.py"
      - "monitor_runner.py"
      - "config/sources.json"
      - "config/deep_seeds.json"
      - ".github/workflows/deep-audit.yml"
  schedule:
    - cron: "13 */3 * * *"

# Deep Audit é telemetria/fingerprint. Ele não fala diretamente com o usuário:
# qualquer confirmação acionável deve passar pelo monitor principal.
permissions:
  contents: write

concurrency:
  group: concursos-watch-deep-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar scripts e seeds
        run: |
          python -m py_compile monitor.py monitor_runner.py smtp_alert.py deep_audit.py
          python monitor.py --self-test
          python - <<'PY'
          import json
          with open("config/deep_seeds.json", encoding="utf-8") as f:
              data = json.load(f)
          for sid, docs in data.get("sources", {}).items():
              assert sid and isinstance(docs, list)
              urls = [d["url"] for d in docs]
              assert len(urls) == len(set(urls)), f"seed duplicado em {sid}"
              assert all(u.startswith("https://") for u in urls)
          print("deep seeds OK")
          PY

      - name: Auditar documentos conhecidos por conteúdo
        # Sem tokens/canais de alerta por design. O Deep Audit só persiste fatos,
        # fingerprints e falhas para correlação posterior.
        run: python deep_audit.py

      - name: Persistir fingerprints
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f state/deep.json ]]; then
            echo "deep_audit.py não gerou state/deep.json"
            exit 1
          fi
          if [[ -z "$(git status --porcelain -- state/deep.json)" ]]; then
            echo "Sem mudança no estado profundo."
            exit 0
          fi
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          git add state/deep.json
          git commit -m "chore(watch): update deep document fingerprints"
          git pull --rebase origin main
          git push origin HEAD:main
