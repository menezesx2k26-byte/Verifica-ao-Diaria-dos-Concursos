name: Concursos Watch — GitHub

on:
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Enviar alerta de teste por todos os canais externos configurados"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "monitor_runner.py"
      - "smtp_alert.py"
      - "new_contests.py"
      - "config/**"
      - "android/**"
      - "requirements.txt"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: concursos-watch-github
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Autoteste local do parser e transport wrapper
        run: |
          python monitor.py --self-test
          python -m py_compile monitor_runner.py smtp_alert.py new_contests.py

      - name: Verificar acompanhamentos prioritários
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          GMAIL_ALERT_TO: ${{ secrets.GMAIL_ALERT_TO }}
          GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}
          CLOUDFLARE_HEARTBEAT_URL: ${{ secrets.CLOUDFLARE_HEARTBEAT_URL }}
          CLOUDFLARE_HEALTH_URL: ${{ secrets.CLOUDFLARE_HEALTH_URL }}
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          WATCH_PRIORITY_TERMS: ${{ secrets.WATCH_PRIORITY_TERMS }}
          WATCH_TEST_ALERT: ${{ inputs.send_test_alert || 'false' }}
          ALERT_GITHUB_ASSIGNEE: menezesx2k26-byte
        run: python monitor_runner.py

      - name: Descobrir concursos e processos seletivos novos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALERT_GITHUB_ASSIGNEE: menezesx2k26-byte
        run: python new_contests.py

      - name: Persistir estados apenas quando mudaram
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          changed=0
          for file in state/github.json state/new_contests.json; do
            if [[ -f "$file" ]] && ! git diff --quiet -- "$file"; then
              git add "$file"
              changed=1
            fi
          done
          if [[ "$changed" == "0" ]]; then
            exit 0
          fi
          git commit -m "chore(watch): update monitor state"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keepalive quinzenal do repositório público
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(date -u +%d)"
          if [[ "$DAY" != "01" && "$DAY" != "15" ]]; then
            exit 0
          fi
          date -u +%FT%TZ > .watch-keepalive
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          git add .watch-keepalive
          git commit -m "chore: scheduled watch keepalive" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se a release Android já existe
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view android-v1.2.0 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.release.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.exists != 'true'
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK
        if: steps.release.outputs.exists != 'true'
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Publicar ConcursosWatch.apk v1.2.0
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ConcursosWatch.apk
          gh release create android-v1.2.0 ConcursosWatch.apk \
            --target "$GITHUB_SHA" \
            --title "Concursos Watch Android v1.2.0" \
            --notes "APK conectado ao monitor GitHub Actions, com alertas filtrados e feed de concursos novos (Federal, Sul, Santa Catarina e Baixada/SP)."
