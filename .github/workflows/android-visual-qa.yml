name: Android Visual QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-visual-qa.yml"
  push:
    branches: [feat/concursos-watch-v3-hardening]
    paths:
      - "android/**"
      - ".github/workflows/android-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: concursos-watch-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            mkdir -p visual-qa
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.menezes.concursoswatch android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.menezes.concursoswatch
            adb shell am start -n com.menezes.concursoswatch/.MainActivity
            sleep 18

            adb exec-out screencap -p > visual-qa/01-home.png

            # Pixel 2 emulator: five equally spaced bottom navigation items.
            adb shell input tap 324 1740
            sleep 2
            adb exec-out screencap -p > visual-qa/02-alertas.png

            adb shell input tap 540 1740
            sleep 2
            adb exec-out screencap -p > visual-qa/03-concursos.png

            adb shell input tap 756 1740
            sleep 2
            adb exec-out screencap -p > visual-qa/04-salvos.png

            adb shell input tap 972 1740
            sleep 2
            adb exec-out screencap -p > visual-qa/05-ajustes.png

            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml visual-qa/window.xml || true

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: ConcursosWatch-v3-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 14
