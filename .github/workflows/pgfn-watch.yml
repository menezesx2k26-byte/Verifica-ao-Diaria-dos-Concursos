name: PGFN Estágio Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

concurrency:
  group: pgfn-estagio-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WATCH_CONFIG: config/pgfn_sources.json
      WATCH_STATE: state/pgfn.json
      WATCH_PRIORITY_TERMS: "consulta,material,ferramenta externa,inteligência artificial,inteligencia artificial,IA,troca de aba,aba,navegador,tempo de prova,tempo por questão,tempo por questao,desconexão,desconexao,fiscalização,fiscalizacao,eliminação,eliminacao,retificação,retificacao"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
      GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
      GMAIL_ALERT_TO: ${{ secrets.GMAIL_ALERT_TO }}
      GMAIL_SMTP_FROM: ${{ secrets.GMAIL_SMTP_FROM }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar configuração
        run: |
          python -m json.tool config/pgfn_sources.json >/dev/null
          python monitor.py --self-test

      - name: Verificar regras e comunicados PGFN/CIEE
        run: python monitor_runner.py

      - name: Persistir estado PGFN somente quando mudou
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f state/pgfn.json ]]; then
            exit 0
          fi
          if git diff --quiet -- state/pgfn.json && git ls-files --error-unmatch state/pgfn.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "pgfn-watch[bot]"
          git config user.email "pgfn-watch[bot]@users.noreply.github.com"
          git add state/pgfn.json
          git commit -m "chore(pgfn-watch): update state" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
