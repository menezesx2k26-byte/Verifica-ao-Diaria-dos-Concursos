name: Deploy Cloudflare Rust Edge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "edge/**"
      - "cloudflare/schema.sql"
      - "cloudflare/migrations/**"
      - "cloudflare/package.json"
      - "cloudflare/package-lock.json"
      - "build_edge_wrangler.py"
      - "ensure_d1_v4.py"
      - "tests/test_build_edge_wrangler.py"
      - ".github/workflows/cloudflare-deploy.yml"
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "cloudflare/schema.sql"
      - "cloudflare/migrations/**"
      - "cloudflare/package.json"
      - "cloudflare/package-lock.json"
      - "build_edge_wrangler.py"
      - "ensure_d1_v4.py"
      - "tests/test_build_edge_wrangler.py"
      - ".github/workflows/cloudflare-deploy.yml"

permissions:
  contents: read

concurrency:
  group: concursos-watch-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_NAME: concursos-watch
    steps:
      - uses: actions/checkout@v4

      - name: Preflight Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Workers Rust toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --locked

      - name: Install Wrangler
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Validate edge config generator
        run: python -m unittest tests.test_build_edge_wrangler -v

      - name: Ensure D1 v4 schema
        run: python ensure_d1_v4.py

      - name: Resolve live D1 binding
        run: python build_edge_wrangler.py edge/wrangler.toml edge/wrangler.generated.toml

      - name: Rust release checks
        run: |
          cargo fmt --manifest-path edge/Cargo.toml --check
          cargo clippy --manifest-path edge/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path edge/Cargo.toml
          cargo check --manifest-path edge/Cargo.toml --target wasm32-unknown-unknown

      - name: Wrangler dry run
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --config ../edge/wrangler.generated.toml

      - name: Deploy Rust Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            env_args=()
          else
            env_args=(--env staging)
          fi
          (cd cloudflare && npx wrangler deploy --config ../edge/wrangler.generated.toml "${env_args[@]}") | tee /tmp/wrangler-deploy.log
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          text=open('/tmp/wrangler-deploy.log', encoding='utf-8', errors='replace').read()
          urls=re.findall(r'https://[^\s\x1b]+\.workers\.dev', text)
          if not urls:
              raise SystemExit('workers.dev URL not found in Wrangler deploy output')
          print('url=' + urls[-1].rstrip('/'))
          PY

      - name: Smoke Rust public read surface
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$BASE_URL/health" >/tmp/health.json && \
               curl -fsS --max-time 20 "$BASE_URL/api/v1/contests?limit=3" >/tmp/contests.json && \
               curl -fsS --max-time 20 "$BASE_URL/api/v1/dashboard-manifest" >/tmp/manifest.json && \
               curl -fsS --max-time 20 "$BASE_URL/dashboard" >/tmp/dashboard.html; then
              break
            fi
            sleep $((attempt * 3))
          done
          python - <<'PY'
          import json
          contests=json.load(open('/tmp/contests.json', encoding='utf-8'))
          manifest=json.load(open('/tmp/manifest.json', encoding='utf-8'))
          assert int(manifest['schema_version']) == 1
          assert manifest['html_sha256'] and manifest['css_sha256']
          rows=contests.get('items', [])
          for row in rows:
              value=str(row.get('relevance_status', 'ACCEPTED'))
              assert not value.startswith(('REJECTED_', 'QUARANTINED_'))
          html=open('/tmp/dashboard.html', encoding='utf-8').read().lower()
          assert '<script' not in html
          print('Rust public smoke OK')
          PY
          code="$(curl -sS -o /tmp/ingest-body -w '%{http_code}' -X POST "$BASE_URL/api/v1/ingest")"
          test "$code" = "404"
          echo "POST /api/v1/ingest -> 404"

      - name: Record deployed endpoint
        shell: bash
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Rust Edge deployment"
            echo "- ref: $GITHUB_REF"
            echo "- endpoint: $BASE_URL"
            echo "- public writes: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean generated config
        if: always()
        run: rm -f edge/wrangler.generated.toml
