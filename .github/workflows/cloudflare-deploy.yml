name: Cloudflare Watch - Centralized

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  centralized:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain centralized deploy
        run: |
          echo "O deploy do Worker foi centralizado no Gabriel-Site-Ops."
          echo "Este repositorio publico nao precisa armazenar CLOUDFLARE_API_TOKEN nem CLOUDFLARE_ACCOUNT_ID."
          echo "O runner privado verifica mudancas em cloudflare/** e faz dry-run, deploy e smoke test."
