name: Deploy Cloudflare Watch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"

permissions:
  contents: write

concurrency:
  group: concursos-watch-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
      WATCH_PRIORITY_TERMS: ${{ secrets.WATCH_PRIORITY_TERMS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      CF_EMAIL_ENABLED: ${{ vars.CF_EMAIL_ENABLED }}
      CF_EMAIL_FROM: ${{ secrets.CF_EMAIL_FROM }}
      CF_EMAIL_TO: ${{ secrets.CF_EMAIL_TO }}
      CF_WORKER_NAME: concursos-watch-redundante
      CF_D1_DATABASE_NAME: concursos-watch

    steps:
      - uses: actions/checkout@v4

      - name: Preflight de credenciais
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$WATCHDOG_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare aguardando secrets::Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e WATCHDOG_TOKEN."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Instalar Wrangler
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Criar/reutilizar KV e D1 e gerar configuração
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: node scripts/bootstrap.mjs

      - name: Preparar secrets do Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: node scripts/secrets.mjs

      - name: Aplicar schema idempotente do D1
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: npx wrangler d1 execute "$CF_D1_DATABASE_NAME" --remote --file=./schema.sql --config wrangler.generated.jsonc

      - name: Validar configuração antes do deploy
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc --secrets-file .secrets.generated.json

      - name: Implantar Worker, API e Cron Triggers
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: npx wrangler deploy --config wrangler.generated.jsonc --secrets-file .secrets.generated.json

      - name: Descobrir URL pública do Worker
        if: steps.preflight.outputs.ready == 'true'
        working-directory: cloudflare
        run: node scripts/discover-url.mjs

      - name: Smoke test /health e /api/v1/contests
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(python -c 'import json; print(json.load(open("config/runtime.json"))["cloudflare_url"])')"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$BASE_URL/health" >/dev/null && \
               curl --fail --silent --show-error --max-time 15 "$BASE_URL/api/v1/contests" >/dev/null; then
              echo "Cloudflare API operacional: $BASE_URL"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Inicializar baseline e heartbeat Cloudflare
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$(python -c 'import json; print(json.load(open("config/runtime.json"))["cloudflare_url"])')"
          curl --fail --silent --show-error --max-time 90 -X POST "$BASE_URL/run" \
            -H "Authorization: Bearer $WATCHDOG_TOKEN" -H "Content-Type: application/json"
          echo

      - name: Persistir URL do Worker no repositório
        if: steps.preflight.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f config/runtime.json ]]; then exit 1; fi
          if [[ -z "$(git status --porcelain -- config/runtime.json)" ]]; then exit 0; fi
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          git add config/runtime.json
          git commit -m "chore(cloudflare): record deployed worker URL"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Limpar arquivos temporários
        if: always()
        shell: bash
        run: rm -f cloudflare/.secrets.generated.json cloudflare/wrangler.generated.jsonc
