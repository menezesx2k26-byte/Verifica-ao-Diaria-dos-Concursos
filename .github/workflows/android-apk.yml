name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: concursos-watch-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile and test installable dev APK
        id: build_debug
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          cp android/app/build/outputs/apk/debug/app-debug.apk ConcursosWatch-v2.0.0-dev.apk
          sha256sum ConcursosWatch-v2.0.0-dev.apk > ConcursosWatch-v2.0.0-dev.apk.sha256

      - uses: actions/upload-artifact@v4
        if: steps.build_debug.outcome == 'success'
        with:
          name: ConcursosWatch-v2.0.0-dev
          path: |
            ConcursosWatch-v2.0.0-dev.apk
            ConcursosWatch-v2.0.0-dev.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish dev release
        if: steps.build_debug.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v2.0.0-dev"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ConcursosWatch-v2.0.0-dev.apk ConcursosWatch-v2.0.0-dev.apk.sha256 --clobber
          else
            gh release create "$TAG" ConcursosWatch-v2.0.0-dev.apk ConcursosWatch-v2.0.0-dev.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "Concursos Watch Android v2.0.0 DEV" \
              --notes "Build instalável de desenvolvimento. V2 reestruturada: Compose, banco local, filtros reais, busca, favoritos, histórico, configurações, sincronização parcial e feed estruturado. Não confundir com release de produção assinada."
          fi

      - name: Prepare production signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed production release
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          gradle -p android :app:assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk ConcursosWatch-v2.0.0.apk
          sha256sum ConcursosWatch-v2.0.0.apk > ConcursosWatch-v2.0.0.apk.sha256

      - name: Publish signed production release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ConcursosWatch-v2.0.0.apk ConcursosWatch-v2.0.0.apk.sha256 --clobber
          else
            gh release create "$TAG" ConcursosWatch-v2.0.0.apk ConcursosWatch-v2.0.0.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "Concursos Watch Android v2.0.0" \
              --notes "Release de produção assinada do Concursos Watch v2.0.0."
          fi

      - name: Persist build diagnostics
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build_debug.outcome }}
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          log = pathlib.Path('android-build.log')
          tail = '\n'.join(log.read_text(errors='replace').splitlines()[-80:]) if log.exists() else ''
          status = {
              'version': '2.0.0',
              'build_outcome': os.environ.get('BUILD_OUTCOME',''),
              'production_signing_configured': os.environ.get('SIGNING_READY','') == 'true',
              'run_id': os.environ.get('RUN_ID',''),
              'run_attempt': os.environ.get('RUN_ATTEMPT',''),
              'sha': os.environ.get('SHA',''),
              'dev_release_url': 'https://github.com/menezesx2k26-byte/Verifica-ao-Diaria-dos-Concursos/releases/tag/android-v2.0.0-dev',
              'production_release_url': 'https://github.com/menezesx2k26-byte/Verifica-ao-Diaria-dos-Concursos/releases/tag/android-v2.0.0',
              'build_log_tail': tail,
          }
          pathlib.Path('state').mkdir(exist_ok=True)
          pathlib.Path('state/android_build.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "concursos-watch[bot]"
          git config user.email "concursos-watch[bot]@users.noreply.github.com"
          git add state/android_build.json
          git commit -m "chore(android): record v2 build status" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
