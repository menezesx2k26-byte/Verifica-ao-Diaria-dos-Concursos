name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: concursos-watch-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ConcursosWatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ConcursosWatch-APK
          path: ConcursosWatch.apk
          if-no-files-found: error
          retention-days: 30
