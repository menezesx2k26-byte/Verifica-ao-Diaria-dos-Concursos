name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main, feat/concursos-watch-v3-hardening]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: concursos-watch-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests and compile dev APK
        id: build_debug
        shell: bash
        run: |
          set -o pipefail
          gradle -p android :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee android-build.log
          cp android/app/build/outputs/apk/debug/app-debug.apk ConcursosWatch-v4.0.0-dev.apk
          sha256sum ConcursosWatch-v4.0.0-dev.apk > ConcursosWatch-v4.0.0-dev.apk.sha256

      - uses: actions/upload-artifact@v4
        if: steps.build_debug.outcome == 'success'
        with:
          name: ConcursosWatch-v4.0.0-dev
          path: |
            ConcursosWatch-v4.0.0-dev.apk
            ConcursosWatch-v4.0.0-dev.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish dev release on main only
        if: steps.build_debug.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v4.0.0-dev"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ConcursosWatch-v4.0.0-dev.apk ConcursosWatch-v4.0.0-dev.apk.sha256 --clobber
          else
            gh release create "$TAG" ConcursosWatch-v4.0.0-dev.apk ConcursosWatch-v4.0.0-dev.apk.sha256 \
              --target "$GITHUB_SHA" --title "Concursos Watch Android v4.0.0 DEV" \
              --notes "V4: Home dinâmica validada e cacheada localmente, WebView sem JavaScript/rede, API Rust read-only, filtro anti-lixo e fallback nativo offline."
          fi

      - name: Prepare production signing
        id: signing
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed production release
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          gradle -p android :app:assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk ConcursosWatch-v4.0.0.apk
          sha256sum ConcursosWatch-v4.0.0.apk > ConcursosWatch-v4.0.0.apk.sha256

      - name: Publish signed production release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-v4.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ConcursosWatch-v4.0.0.apk ConcursosWatch-v4.0.0.apk.sha256 --clobber
          else
            gh release create "$TAG" ConcursosWatch-v4.0.0.apk ConcursosWatch-v4.0.0.apk.sha256 --target "$GITHUB_SHA" --title "Concursos Watch Android v4.0.0" --notes "Release assinada da arquitetura v4 híbrida e read-only."
          fi
