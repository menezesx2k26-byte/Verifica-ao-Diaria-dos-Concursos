name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: concursos-watch-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ConcursosWatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ConcursosWatch-APK
          path: ConcursosWatch.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-v1.2.0 >/dev/null 2>&1; then
            gh release upload android-v1.2.0 ConcursosWatch.apk --clobber
          else
            gh release create android-v1.2.0 ConcursosWatch.apk \
              --target "$GITHUB_SHA" \
              --title "Concursos Watch Android v1.2.0" \
              --notes "APK conectado ao monitor GitHub Actions, com alertas filtrados e feed ampliado de concursos novos em fontes oficiais, incluindo federal e Sul com prioridade para Santa Catarina."
          fi
