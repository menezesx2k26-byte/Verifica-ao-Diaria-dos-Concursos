[package]
name = "concursos-watch-edge"
version = "4.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.5", features = ["d1"] }

[dev-dependencies]
pretty_assertions = "1"
